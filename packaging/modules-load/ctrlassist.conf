# CtrlAssist makes its virtual pads through uinput, and through uhid for
# the identities that need a HID device. Neither is loaded until something
# asks, and the udev rule that gives them to the seat user needs the nodes
# to exist.
uinput
uhid
# A virtual DualSense is a pad of the kernel's PlayStation driver, which
# has to be there before the pad is: otherwise the generic driver takes it.
hid-playstation
# A virtual Steam Controller is a pad of the kernel's own driver for it,
# from Linux 7.3, which has to be there likewise.
hid-steam

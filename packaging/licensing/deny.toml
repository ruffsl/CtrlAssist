# cargo-deny config: the license policy and the one-version-per-crate gate.
#
# `[licenses]` enforces the SPDX allow-list. `[bans]` fails on a crate
# appearing in two versions, except for a skip-list of duplicates forced
# from upstream, each with its reason. `[sources]` pins code provenance to
# crates.io. `[advisories]` is not part of `just deny`: advisories are
# checked on their own schedule, so a newly disclosed one against an
# unchanged dependency doesn't gate unrelated changes.

# Only the platforms shipped for. Without this, cargo-deny considers every
# target triple and reports duplicates among crates never compiled here.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # ksni, the tray. Public-domain equivalent.
    "Unlicense",
]
confidence-threshold = 0.93

# Crates whose license isn't in the allow-list, each for its own reason.
exceptions = [
    # zenoh-util -> shellexpand -> dirs. Weak copyleft, file-level; used
    # unmodified. TisVlay carries the same exception.
    { name = "option-ext", allow = ["MPL-2.0"] },
    # Build-time only (psm's build script, under zenoh-config's json5
    # parser); Apache-2.0 with LLVM's linking exception, which only widens
    # what Apache-2.0 already allows.
    { name = "ar_archive_writer", allow = ["Apache-2.0 WITH LLVM-exception"] },
    # Slint, the settings window's toolkit, under its royalty-free
    # license, which a desktop application qualifies for and which asks
    # for attribution: the About pane and the license bundle carry it.
    # TisVlay's list.
    { name = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "slint-build", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
]

[bans]
multiple-versions = "deny"
skip = [
    # All of these come with zenoh 1.10, the control plane, whose pin is
    # TisVlay's. Re-audit them together when zenoh moves.

    # Whole crates: several versions each, none of them ours to choose.
    { crate = "hashbrown", reason = "zenoh's keyed-set, petgraph and zenoh-keyexpr each pin their own; indexmap is on the newest" },
    { crate = "foldhash", reason = "hashbrown 0.15 and 0.16 counterparts" },
    { crate = "getrandom", reason = "zenoh's rand 0.8 and ahash keep 0.2 and 0.3; the rest of the tree is on 0.4" },

    # Exact versions: each names the older one and what pins it, so the
    # entry fails the gate as unnecessary once that catches up.
    { crate = "rand_core@0.6.4", reason = "rand 0.8 counterpart (zenoh-keyexpr)" },
    { crate = "socket2@0.5.10", reason = "zenoh pins socket2 0.5; tokio is on 0.6" },
    { crate = "spin@0.9.9", reason = "flume 0.11 (zenoh's channel) pins spin 0.9; uhlc (zenoh's timestamps) is on 0.10" },
    { crate = "syn@2.0.119", reason = "zenoh's proc-macro dependencies and tracing-attributes are still on syn 2" },
    { crate = "toml@0.9.12", reason = "zenoh-config (under zenoh-ext's unstable feature) pins toml 0.9; the workspace is on 1.x" },
    { crate = "toml_datetime@0.7.5", reason = "toml 0.9 counterpart (zenoh-config)" },
    { crate = "winnow@0.7.15", reason = "toml 0.9 counterpart (zenoh-config)" },

    # These come with Slint 1.19, the settings window's toolkit, whose pin
    # is TisVlay's, and so are its skips. Re-audit them together when
    # Slint or winit moves.

    # winit 0.30 (Slint's `unstable-winit-030` backend) pins SCTK 0.19
    # and with it calloop 0.13, which keeps rustix 0.38 and thiserror 1
    # beside the rest of the tree's rustix 1 and thiserror 2.
    { crate = "rustix", reason = "winit's SCTK 0.19 path keeps rustix 0.38" },
    { crate = "linux-raw-sys", reason = "rustix 0.38 counterpart" },
    { crate = "thiserror", reason = "winit's SCTK 0.19 path keeps thiserror 1" },
    { crate = "thiserror-impl", reason = "thiserror's proc-macro counterpart" },
    { crate = "tiny-skia", reason = "Slint's resvg is on 0.12; sctk-adwaita (SCTK 0.19 path) on 0.11" },
    { crate = "tiny-skia-path", reason = "tiny-skia counterpart" },
    { crate = "smol_str", reason = "winit and Slint's compiler each pin their own" },
    { crate = "itertools@0.14.0", reason = "zenoh 1.10 pins itertools 0.14; Slint and femtovg are on 0.15" },
    { crate = "smithay-client-toolkit@0.19.2", reason = "winit 0.30's sctk-adwaita pins SCTK 0.19; Slint's smithay-clipboard is on 0.20" },
    { crate = "calloop@0.13.0", reason = "SCTK 0.19 counterpart (winit)" },
    { crate = "calloop-wayland-source@0.3.0", reason = "SCTK 0.19 counterpart (winit)" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 (Slint's image stack) pins miniz_oxide 0.8; the rest of the tree is on 0.9" },
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

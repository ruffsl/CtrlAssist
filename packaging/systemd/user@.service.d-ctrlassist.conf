# Lets users' services ask for real-time scheduling up to priority 10,
# which CtrlAssist's daemon does for its input thread. A user service
# can't have more than the user's service manager has, so the limit is
# raised here, on the manager. It reaches no login shell, and the kernel's
# own cap on real-time CPU time still applies. Remove this file to turn it
# off: the daemon then runs the same and says it was refused.
[Service]
LimitRTPRIO=10

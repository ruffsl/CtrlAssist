# A throwaway: can the settings window be drawn off screen, from made-up
# state, closely enough to stand as a screenshot in the user guide?
[workspace]

[package]
name = "screenshots-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ctrlassist = { path = "../../crates/ctrlassist" }
ctrlassist_gui = { path = "../../crates/ctrlassist-gui-app", package = "ctrlassist-gui-app" }
ctrlassist-icons = { path = "../../crates/ctrlassist-icons" }
ctrlassist-protocol = { path = "../../crates/ctrlassist-protocol" }
i-slint-core = "=1.19.0"
png = "0.17"
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
tracing = "0.1"

[patch.crates-io]
evdev = { path = "../../vendor/evdev" }

[package]
name = "spike-loop"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "loopspike"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
libc = "0.2"

[profile.release]
debug = "line-tables-only"

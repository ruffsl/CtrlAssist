name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    # Drafts skip the heavy jobs, so marking a PR ready starts a full run.
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

# Default for every job; a job widens it only where it needs to.
permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run. Pushes to main
# group by commit, so none is ever cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs dispatch through `just`, so a failure here reproduces locally
# with the recipe of the same name.
jobs:
  # Which jobs this change needs. GitHub's `paths` filters only gate whole
  # workflows, so the gate is a job whose outputs the others read.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify
        id: classify
        env:
          # A PR checks out its merge commit, whose first parent is main.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # Fail open: no diff, or an empty one, runs everything.
          if ! files=$(git diff --name-only "$BASE" HEAD) || [ -z "$files" ]; then
            printf 'code=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs-only paths. Crate READMEs are not: they're doctests.
          docs='^(docs/|\.claude/|README\.md$|LICENSE$)'
          code=false; grep -qvE "$docs" <<< "$files" && code=true
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"

  # File checks, spelling and the workflow linters on every run, drafts
  # and docs-only changes included.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the dev shell's versions, so local and CI agree.
      - name: Setup
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: |
            actionlint@1.7.12
            just
            shellcheck@0.11.0
            typos@1.51.1
            zizmor@1.32.0

      - name: File checks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          # zizmor's online audits (such as a pinned SHA that doesn't match
          # its version comment) read the GitHub API.
          GH_TOKEN: ${{ github.token }}
        with:
          extra-args: >-
            --all-files
            check-added-large-files check-merge-conflict check-toml
            check-yaml end-of-file-fixer trailing-whitespace typos
            actionlint zizmor

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libudev for the udev crate, libsystemd for the hiding service's
      # session check.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev libsystemd-dev pkg-config

      - name: Toolchain
        run: rustup component add llvm-tools-preview && rustup show

      - name: Setup
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: |
            cargo-deny@0.20.2
            cargo-llvm-cov
            cargo-nextest
            cargo-shear@1.14.0
            just
            tombi@1.7.1
            typos@1.51.1

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      # The hooks the Test step doesn't repeat: it builds, lints and tests
      # under coverage itself. The workflow linters ran in the checks job.
      - name: Lint
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: >-
            --all-files
            --skip build
            --skip clippy
            --skip test
            --skip actionlint
            --skip zizmor

      # A runner is nobody's seat, so nothing gives its user uinput or the
      # event nodes. Open them on this throwaway machine, and make a test
      # that still can't make a fake pad fail instead of skipping.
      - name: Let the tests make fake pads
        run: |
          sudo modprobe uinput
          echo 'KERNEL=="uinput", MODE="0666"' | sudo tee /etc/udev/rules.d/99-ctrlassist-ci.rules
          echo 'SUBSYSTEM=="input", MODE="0666"' | sudo tee --append /etc/udev/rules.d/99-ctrlassist-ci.rules
          sudo udevadm control --reload
          sudo udevadm trigger --settle

      - name: Test
        run: just test-ci
        env:
          CTRLASSIST_REQUIRE_FAKE_PADS: "1"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  # The workspace still builds on the oldest compiler it claims to support.
  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libudev for the udev crate, libsystemd for the hiding service's
      # session check.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev libsystemd-dev pkg-config

      # The floor is read from Cargo.toml, padded to x.y.z for rustup.
      - name: Toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          case "$msrv" in *.*.*) ;; *) msrv="$msrv.0" ;; esac
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

  # The one check a branch ruleset needs to require: it passes only if
  # every job above passed or was skipped.
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, checks, ci, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

[workspace]
resolver = "3"
members = ["crates/*"]
# The shipping binaries. A bare `cargo build` (without `--workspace`)
# scopes to these and what they depend on, so the Nix package reads one
# list instead of repeating it. `just` recipes pass `--workspace`.
default-members = ["crates/ctrlassist-cli", "crates/ctrlassist-hider"]
# The spikes are throwaway workspaces of their own, deleted as the crates
# that replace them land.
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.5.0"
edition = "2024"
# The oldest compiler the workspace supports. Never above the rustc that
# nixpkgs ships: the Nix package builds with the consumer's compiler. The
# pinned toolchain in rust-toolchain.toml may run ahead of it.
rust-version = "1.95"
authors = ["ruffsl <roxfoxpox@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/CtrlAssist/CtrlAssist"
publish = false

# Every dependency is declared once here and inherited by the crates.
[workspace.dependencies]
# Internal crates. Unpublished ones are path-only.
ctrlassist = { path = "crates/ctrlassist" }
ctrlassist-cli = { path = "crates/ctrlassist-cli" }
ctrlassist-gui = { path = "crates/ctrlassist-gui" }
ctrlassist-icons = { path = "crates/ctrlassist-icons" }
ctrlassist-core = { path = "crates/ctrlassist-core" }
ctrlassist-daemon = { path = "crates/ctrlassist-daemon" }
ctrlassist-device = { path = "crates/ctrlassist-device" }
ctrlassist-hider = { path = "crates/ctrlassist-hider" }
ctrlassist-protocol = { path = "crates/ctrlassist-protocol" }
ctrlassist-test = { path = "crates/ctrlassist-test" }
ctrlassist-tray = { path = "crates/ctrlassist-tray" }

# Profiles on disk and payloads on the wire
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# The control plane. Every link is a Unix socket, so zenoh's default
# transports are switched off, as in TisVlay, whose pin this is.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zenoh = { version = "1.10", default-features = false, features = ["transport_unixsock-stream"] }
# Tilde, not caret: `unstable` switches on zenoh's unstable and internal
# APIs (the cached publishers and history subscribers state rides on),
# which may break within 1.x. Bumped deliberately, with TisVlay's.
zenoh-ext = { version = "~1.10", default-features = false, features = ["unstable"] }

# Logging
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry"] }

# The tray: a StatusNotifierItem, and desktop notifications (z-with-tokio
# keeps zbus on tokio and drops the default async-io stack). TisVlay's pins.
ksni = "0.3"
# Held below 4.19, which moved to zbus 6 while ksni is on zbus 5: one
# zbus in the tree, as in TisVlay, until ksni moves too.
notify-rust = { version = ">=4.18, <4.19", default-features = false, features = ["z-with-tokio"] }

# The settings window's toolkit, shared by ctrlassist-gui (the compiled
# UI) and ctrlassist-gui-app (the code driving it). Wayland only, which
# keeps the X11 crates out of the build. `unstable-winit-030` has no
# stability promise, so slint is pinned exactly: bump it together with
# slint-build and i-slint-backend-testing. TisVlay's pin and features.
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit-wayland", "compat-1-2", "renderer-femtovg", "gettext", "unstable-winit-030"] }

# Freedesktop icon-theme lookup, a name to a file's path, through
# ctrlassist-icons. TisVlay's pin.
freedesktop-icons = "0.4"

# The window's calls on the desktop: the file manager over D-Bus, on
# tokio as the tray's crates are, and the user's browser for a link.
# TisVlay's pins.
webbrowser = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Tests
tempfile = "3"

# Errors
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }
# The book's CLI reference, written from the clap tree.
clap-markdown = "0.1"
# unstable-dynamic: completions that ask the running program, so a pad's
# id or a profile's name completes from the daemon. As in TisVlay.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

# Raw FFI types, where a C library is called directly
libc = { version = "0.2", default-features = false }

# The kernel's input interfaces
evdev = "0.13"
# libudev: device properties and the device tree
udev = "0.9"
# Safe wrappers over the syscalls the standard library doesn't cover
rustix = "1.1"

# Tests
proptest = "1"

# The lint policy and its reasons are in docs/build.md. Everything is at
# `warn`; the gate recipes turn warnings into errors.
[workspace.lints.rust]
unreachable_pub = "warn"
missing_debug_implementations = "warn"
# deny, not forbid: a file opts out with a reasoned #![expect(unsafe_code)].
unsafe_code = "deny"
unused_qualifications = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
get_unwrap = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
panic = "warn"
cast_lossless = "warn"
borrow_as_ptr = "warn"
ignored_unit_patterns = "warn"
manual_let_else = "warn"
ptr_as_ptr = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

[profile.dev]
split-debuginfo = "unpacked"

# Build and clippy use the test profile so `cargo test` reuses their work.
[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

# No LTO or single codegen unit: this is the profile people compile locally.
[profile.release]
strip = "symbols"

# What the packages are built with.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = "s"

# Crates carried with a fix upstream doesn't have yet; see vendor/README.md.
[patch.crates-io]
evdev = { path = "vendor/evdev" }

[package]
name = "ctrlassist-gui-app"
description = "CtrlAssist's settings window (Slint): the code that drives it, and the binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "ctrlassist_gui"
path = "src/lib.rs"

[[bin]]
name = "ctrlassist-gui"
path = "src/main.rs"

# Makes the user guide's screenshots (`just docs-screenshots`). Built only
# with its feature, so the shipped window has no software renderer.
[[bin]]
name = "ctrlassist-screenshots"
path = "src/bin/screenshots.rs"
required-features = ["screenshots"]

[features]
screenshots = [
    "dep:i-slint-core",
    "dep:png",
    "slint/renderer-software",
    "slint/software-renderer-systemfonts",
]

[dependencies]
anyhow = { workspace = true }
ashpd = { workspace = true }
clap = { workspace = true }
ctrlassist = { workspace = true }
ctrlassist-daemon = { workspace = true }
ctrlassist-gui = { workspace = true }
ctrlassist-icons = { workspace = true }
ctrlassist-protocol = { workspace = true }
fontique = { workspace = true }
futures-util = { workspace = true }
i-slint-core = { workspace = true, optional = true }
png = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
webbrowser = { workspace = true }
wl-clipboard-rs = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
# Pinned with slint: its API has no semver promise.
i-slint-backend-testing = "=1.19.0"

[lints]
workspace = true

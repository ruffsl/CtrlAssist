[package]
name = "ctrlassist-cli"
description = "The ctrlassist command: the daemon as a service verb, and the clients that talk to it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ctrlassist"
path = "src/main.rs"
# The SDK library is also named `ctrlassist`; documenting both writes the
# same `target/doc/ctrlassist/` page, and rustdoc warns on the collision.
# The command's reference lives in its `--help`, not in rustdoc.
doc = false

[dependencies]
anyhow = { workspace = true }
# unstable-ext: the derive `#[arg(add = …)]` value-candidate attribute
# maps to Arg::add, which is gated behind it.
clap = { workspace = true, features = ["unstable-ext"] }
clap_complete = { workspace = true }
ctrlassist = { workspace = true }
ctrlassist-daemon = { workspace = true }
ctrlassist-protocol = { workspace = true }
ctrlassist-tray = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zenoh = { workspace = true }

[dev-dependencies]
ctrlassist-test = { workspace = true }
ctrlassist-device = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

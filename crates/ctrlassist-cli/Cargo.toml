[package]
name = "ctrlassist-cli"
description = "The ctrlassist command: the daemon as a service verb, and the clients that talk to it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.nfpm]
name = "ctrlassist"
# The whole distribution, not just this crate's command: cargo-nfpm would
# otherwise use the crate description above.
description = "Controller assist for gaming on Linux: several game controllers as one, or one as several. Daemon, tray, settings window, command and hiding service"
section = "games"
priority = "optional"

contents = [
    # `ctrlassist`, which is also the daemon and the tray, is added by
    # cargo-nfpm from the -p target; the hiding service is its own binary.
    # target/nfpm-dist links to the packaged triple's dist/ (`just
    # package-build` sets it).
    { src = "target/nfpm-dist/ctrlassist-hider", dst = "/usr/bin/ctrlassist-hider" },
    # The settings window, its entry in the launcher, and the session
    # bus's way of starting it, by which a second launch and the tray
    # raise the window that is open.
    { src = "target/nfpm-dist/ctrlassist-gui", dst = "/usr/bin/ctrlassist-gui" },
    { src = "packaging/freedesktop/io.github.ctrlassist.Gui.desktop", dst = "/usr/share/applications/io.github.ctrlassist.Gui.desktop" },
    { src = "packaging/systemd/io.github.ctrlassist.Gui.service", dst = "/usr/share/dbus-1/services/io.github.ctrlassist.Gui.service" },
    # The hiding service: a user of its own with no capabilities, started
    # on demand from its socket, and the rule that gives its group what it
    # hides pads with.
    { src = "packaging/systemd/ctrlassist-hider.socket", dst = "/usr/lib/systemd/system/ctrlassist-hider.socket" },
    { src = "packaging/systemd/ctrlassist-hider.service", dst = "/usr/lib/systemd/system/ctrlassist-hider.service" },
    { src = "packaging/sysusers/ctrlassist.conf", dst = "/usr/lib/sysusers.d/ctrlassist.conf" },
    { src = "packaging/udev/72-ctrlassist-hide.rules", dst = "/usr/lib/udev/rules.d/72-ctrlassist-hide.rules" },
    # The daemon and the tray, each user's own services.
    { src = "packaging/systemd/ctrlassist-daemon.service", dst = "/usr/lib/systemd/user/ctrlassist-daemon.service" },
    { src = "packaging/systemd/ctrlassist-tray.service", dst = "/usr/lib/systemd/user/ctrlassist-tray.service" },
    # Raises the real-time limit of users' service managers to what the
    # daemon's input thread asks for; the file says how to turn it off.
    { src = "packaging/systemd/user@.service.d-ctrlassist.conf", dst = "/usr/lib/systemd/system/user@.service.d/10-ctrlassist.conf" },
    # uinput and uhid for the seat user, and the modules behind them.
    { src = "packaging/udev/70-ctrlassist.rules", dst = "/usr/lib/udev/rules.d/70-ctrlassist.rules" },
    { src = "packaging/modules-load/ctrlassist.conf", dst = "/usr/lib/modules-load.d/ctrlassist.conf" },
    # The project's notice, which carries the controller database's
    # license, and the licenses of every crate built in, generated by
    # `just licenses-html` (a package-* prerequisite).
    { src = "packaging/licensing/NOTICE", dst = "/usr/share/doc/ctrlassist/NOTICE" },
    { src = "packaging/licensing/THIRD-PARTY-LICENSES.html", dst = "/usr/share/doc/ctrlassist/THIRD-PARTY-LICENSES.html" },
    # What registers the command's completions with each shell, generated
    # by `just completions` (a package-* prerequisite) and dropped into the
    # shell's autoload directory under the name it looks for. Each calls
    # back into the binary at <TAB> for live values.
    { src = "packaging/completions/ctrlassist.bash", dst = "/usr/share/bash-completion/completions/ctrlassist" },
    { src = "packaging/completions/ctrlassist.zsh", dst = "/usr/share/zsh/site-functions/_ctrlassist" },
    { src = "packaging/completions/ctrlassist.fish", dst = "/usr/share/fish/vendor_completions.d/ctrlassist.fish" },
]

[package.metadata.nfpm.scripts]
postinstall = "packaging/scripts/postinstall.sh"
preremove = "packaging/scripts/preremove.sh"
postremove = "packaging/scripts/postremove.sh"

# pacman runs post_install only on a first install and calls
# post_upgrade on an upgrade, which nfpm's archlinux packager writes only
# from these (arch/arch.go, createScripts). deb and rpm run postinstall
# on both.
[package.metadata.nfpm.archlinux.scripts]
postupgrade = "packaging/scripts/postinstall.sh"

# Runtime libraries: libudev for the daemon and the hiding service, and
# libsystemd for the hiding service's session check. The window links
# fontconfig, so the loader needs it before the window's first line runs,
# and loads the rest at run time, which no linker lists: OpenGL and EGL,
# the Wayland client libraries, and libxkbcommon, which winit loads even
# on Wayland. Names follow Debian and Ubuntu (deb), Fedora (rpm) and
# Arch; check them against the target distribution before each release.
#
# And systemd and udev themselves, 248 or newer, each under the name its
# format gives it (Arch's systemd carries udev): the scripts run
# systemd-sysusers, systemctl and udevadm, the hiding service is a system
# unit whose rule udev runs, and 248 is the oldest systemd with all that
# its unit and rule use, worked out from when each arrived and tried on
# 262 alone. Each format writes a version bound its own way.
#
# These must live under `overrides.<packager>`, mirroring nfpm's own
# schema: cargo-nfpm's per-format tables have no `depends` field, so keys
# placed there are silently dropped.
[package.metadata.nfpm.overrides.deb]
depends = [
    "libc6",
    "libudev1",
    "libsystemd0",
    "libfontconfig1",
    "libgl1",
    "libegl1",
    "libwayland-client0",
    "libwayland-egl1",
    "libxkbcommon0",
    "systemd (>= 248)",
    "udev (>= 248)",
]
# Weak: the bash-completion loader, so the shipped registration autoloads.
recommends = ["bash-completion"]
# GNOME only: the tray icon needs a StatusNotifier host, which vanilla
# GNOME lacks. Suggests, not Recommends: the extension depends on
# gnome-shell, and a Recommends would pull the shell onto other desktops.
suggests = ["gnome-shell-extension-appindicator"]

[package.metadata.nfpm.overrides.rpm]
depends = [
    "glibc",
    "systemd-libs",
    "fontconfig",
    "mesa-libGL",
    "mesa-libEGL",
    "libwayland-client",
    "libwayland-egl",
    "libxkbcommon",
    "systemd >= 248",
    "systemd-udev >= 248",
]
recommends = ["bash-completion"]
suggests = ["gnome-shell-extension-appindicator"]

# Hard dependencies only: cargo-nfpm's archlinux packager emits no weak
# ones.
[package.metadata.nfpm.overrides.archlinux]
depends = [
    "glibc",
    "systemd-libs",
    "fontconfig",
    "libglvnd",
    "wayland",
    "libxkbcommon",
    "systemd>=248",
]

[[bin]]
name = "ctrlassist"
path = "src/main.rs"
# The SDK library is also named `ctrlassist`; documenting both writes the
# same `target/doc/ctrlassist/` page, and rustdoc warns on the collision.
# The command's reference lives in its `--help`, not in rustdoc.
doc = false

[dependencies]
anyhow = { workspace = true }
# unstable-ext: the derive `#[arg(add = …)]` value-candidate attribute
# maps to Arg::add, which is gated behind it.
clap = { workspace = true, features = ["unstable-ext"] }
clap_complete = { workspace = true }
ctrlassist = { workspace = true }
ctrlassist-daemon = { workspace = true }
ctrlassist-protocol = { workspace = true }
ctrlassist-tray = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zenoh = { workspace = true }

[dev-dependencies]
ctrlassist-test = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
